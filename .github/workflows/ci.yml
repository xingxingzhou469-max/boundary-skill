name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install IANA timezone database on Windows
        if: runner.os == 'Windows'
        run: python -m pip install tzdata
      - name: Validate repository
        run: python scripts/check_repo.py
      - name: Check self-contained ChatGPT task prompts
        run: python scripts/build_task_prompts.py --check
      - name: Test state lifecycle and bundled examples
        run: python -m unittest discover -v
      - name: Exercise the documented demo
        run: python scripts/demo.py
